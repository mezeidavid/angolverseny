<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angol Verseny Menedzser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Angol Verseny Menedzser</h1>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(0)">Jelenléti ív</button>
            <button class="tab" onclick="switchTab(1)">Pontozás</button>
            <button class="tab" onclick="switchTab(2)">Helyezések</button>
        </div>

        <!-- Tab 1: Jelenléti ív -->
        <div class="tab-content active" id="tab-0">
            <div class="upload-section">
                <h2 style="margin-bottom: 15px; color: #2c3e50;">Excel fájl importálása</h2>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFile(event)">
                <p style="margin-top: 10px; color: #7f8c8d; font-size: 14px;">Oszlopok: Csapatnév, Tag1, Tag2, Tag3, Iskola</p>
            </div>

            <div id="teamsList"></div>
        </div>

        <!-- Tab 2: Pontozás -->
        <div class="tab-content" id="tab-1">
            <div class="task-section">
                <h2 style="margin-bottom: 15px; color: #2c3e50;">Feladatok kezelése</h2>
                <div class="add-task">
                    <input type="text" class="task-input" id="taskName" placeholder="Feladat neve (pl. Listening, Grammar...)">
                    <input type="number" class="task-input" id="taskMaxScore" placeholder="Max pont" style="width: 150px;">
                    <button class="btn btn-success" onclick="addTask()">Feladat hozzáadása</button>
                </div>
            </div>

            <div id="scoringTable"></div>
        </div>

        <!-- Tab 3: Helyezések -->
        <div class="tab-content" id="tab-2">
            <h2 style="margin-bottom: 15px; color: #2c3e50;">Végleges helyezések</h2>
            <div id="rankingTable"></div>
        </div>

        <div class="db-config" id="dbConfig">
            <input type="text" class="db-input" id="supabaseUrl" placeholder="Supabase URL (https://xxx.supabase.co)">
            <input type="password" class="db-input" id="supabaseKey" placeholder="Supabase Anon Key">
            <button class="btn" onclick="connectDatabase()">Kapcsolódás</button>
            <span class="db-status disconnected" id="dbStatus">Nincs kapcsolat</span>
        </div>

        <div class="db-toggle">
            <button class="db-toggle-btn" onclick="toggleDatabaseConfig()" title="Adatbázis beállítások">
                🌐
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
